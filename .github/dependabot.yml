---
version: 2

multi-ecosystem-groups:
  backend:
    schedule:
      interval: "monthly"
  frontend:
    schedule:
      interval: "monthly"
  infra:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  - package-ecosystem: "npm"
    directory: "/web"
    patterns:
      - "*"
    multi-ecosystem-group: "frontend"

  - package-ecosystem: "docker"
    directory: "/clowarden-server"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"
    ignore:
      - dependency-name: "node"
        versions:
          [
            "19-alpine3.19",
            "20-alpine3.19",
            "21-alpine3.19",
            "22-alpine3.19",
            "22-alpine3.20",
          ]

  - package-ecosystem: "docker"
    directory: "/database/migrations"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"
