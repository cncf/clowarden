[workspace]
resolver = "3"
members = [
    "clowarden-cli",
    "clowarden-core",
    "clowarden-server"
]

[workspace.package]
version = "0.2.3"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "1.0.104"
as-any = "0.3.2"
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
cached = { version = "4.1.0", features = ["async"] }
clap = { version = "4.6.7", features = ["derive"] }
clowarden-core = { path = "../clowarden-core" }
deadpool-postgres = { version = "0.14.2", features = ["serde"] }
figment = { version = "0.10.19", features = ["yaml", "env"] }
futures = "0.3.34"
hmac = "0.13.0"
hex = "0.4.3"
mime = "0.3.17"
mockall = "0.15.0"
octorust = { git = "https://github.com/tegioz/third-party-api-clients.git" }
openssl = { version = "0.10.82", features = ["vendored"] }
pem = "4.0.0"
postgres-openssl = "0.5.3"
regex = "1.13.1"
reqwest = { version = "0.11.14", default-features = false, features = [
    "json",
    "multipart",
] } # do-not-upgrade
reqwest-conditional-middleware = "0.1.0" # do-not-upgrade
reqwest-middleware = "0.1.5" # do-not-upgrade
reqwest-retry = "0.1.4" # do-not-upgrade
reqwest-tracing = "0.3.0" # do-not-upgrade
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_qs = "1.1.3"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = [
    "formatting",
    "macros",
    "parsing",
    "serde",
] }
tokio = { version = "1.54.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-postgres = { version = "0.7.18", features = [
    "with-uuid-1",
    "with-serde_json-1",
    "with-time-0_3",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["auth", "fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
